# Northling Arch — hypridle.conf
# Блокировка и сон не конфликтуют: сначала экран блокируется, потом (позже) идёт сон,
# а перед любым сном экран блокируется принудительно.
#
# Хочешь поменять время — правь числа timeout (в СЕКУНДАХ):
#   600  = 10 минут  → блокировка
#   1800 = 30 минут  → сон
# После правки: pkill hypridle; hypridle &   (или перезайди в сессию)

general {
    lock_cmd = pidof hyprlock || hyprlock       # что значит «заблокировать»
    before_sleep_cmd = loginctl lock-session    # перед сном — всегда блокировать
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
