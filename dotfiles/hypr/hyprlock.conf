# Northling Arch — hyprlock.conf (экран блокировки, Northling Midnight)
# Фон — те же обои, что на рабочем столе (симлинк, меняется через northling-wallpaper).

general {
    hide_cursor = true
}

background {
    monitor =
    path = @HOME@/.config/northling/wallpaper
    color = rgba(14, 10, 36, 1.0)
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
}

# Большие часы
label {
    monitor =
    text = $TIME
    color = rgba(229, 231, 245, 1.0)
    font_size = 110
    font_family = Inter
    position = 0, 180
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] @HOME@/.local/bin/northling-info date
    color = rgba(167, 139, 250, 1.0)
    font_size = 22
    font_family = Inter
    position = 0, 85
    halign = center
    valign = center
}

# Погода
label {
    monitor =
    text = cmd[update:900000] @HOME@/.local/bin/northling-info weather
    color = rgba(196, 184, 245, 1.0)
    font_size = 16
    font_family = Inter
    position = 0, 45
    halign = center
    valign = center
}

# Что играет
label {
    monitor =
    text = cmd[update:5000] @HOME@/.local/bin/northling-info player
    color = rgba(158, 148, 205, 1.0)
    font_size = 14
    font_family = Inter
    position = 0, -150
    halign = center
    valign = center
}

# Норт (стикер выбирается: northling mascot set имя)
image {
    monitor =
    path = @HOME@/.config/northling/mascot.png
    size = 280
    rounding = 0
    border_size = 0
    position = -50, 40
    halign = right
    valign = bottom
}

# Логотип
label {
    monitor =
    text = n.
    color = rgba(167, 139, 250, 1.0)
    font_size = 54
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}

# Приветствие
label {
    monitor =
    text = Привет, $USER
    color = rgba(229, 231, 245, 0.9)
    font_size = 16
    font_family = Inter
    position = 0, -5
    halign = center
    valign = center
}

# Поле пароля
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(167, 139, 250, 1.0)
    inner_color = rgba(28, 17, 85, 0.85)
    font_color = rgba(229, 231, 245, 1.0)
    fade_on_empty = true
    placeholder_text = <i>Пароль…</i>
    rounding = 18
    position = 0, -60
    halign = center
    valign = center
}
