add_newline = true
format = "$directory$git_branch$git_status$character"

[directory]
style = "bold #2ee6c8"
truncation_length = 3

[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "#7fe3ff"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "#ff7a9c"

[character]
success_symbol = "[❯](bold #2ee6c8)"
error_symbol = "[❯](bold #ff7a9c)"
