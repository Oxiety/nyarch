# nyarch kitty: teal on near-black, translucent (Hyprland blurs what is behind)

font_family      JetBrainsMono Nerd Font
font_size        12.0
bold_font        auto
italic_font      auto

window_padding_width 12
background_opacity   0.82
cursor_shape         beam
cursor_blink_interval 0
confirm_os_window_close 0
enable_audio_bell    no
tab_bar_min_tabs     2
tab_bar_style        powerline
hide_window_decorations yes

foreground            #d7f5ef
background            #081416
selection_foreground  #04181a
selection_background  #2ee6c8
cursor                #2ee6c8
url_color             #7fe3ff

active_tab_foreground   #04181a
active_tab_background   #2ee6c8
inactive_tab_foreground #5f8f8a
inactive_tab_background #0b1618

